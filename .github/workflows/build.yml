name: Build Magic RDR

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Release x86
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Add NuGet to PATH
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore Magic_RDR.sln -PackagesDirectory packages -NonInteractive

      - name: Build solution
        run: >-
          msbuild Magic_RDR.sln
          /m
          /p:Configuration=Release
          /p:Platform=x86
          /p:RestorePackages=false
          /verbosity:minimal

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: MagicRDR-${{ github.sha }}-x86
          path: Magic_RDR/bin/x86/Release/
          if-no-files-found: error
          retention-days: 30
