name: Build Magic RDR

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      legacy_assemblies_url:
        description: URL of a ZIP containing the legacy Assemblies directory
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Release x86
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          $nuget = Join-Path $env:RUNNER_TEMP 'nuget.exe'
          Invoke-WebRequest 'https://dist.nuget.org/win-x86-commandline/latest/nuget.exe' -OutFile $nuget
          & $nuget restore Magic_RDR.sln -PackagesDirectory packages -NonInteractive

      - name: Restore legacy assemblies
        shell: pwsh
        env:
          LEGACY_ASSEMBLIES_URL: ${{ inputs.legacy_assemblies_url || vars.LEGACY_ASSEMBLIES_URL }}
        run: |
          $assemblyDir = Get-Item 'Dependencies/Assemblies' -ErrorAction SilentlyContinue
          if (-not $assemblyDir) {
            if ([string]::IsNullOrWhiteSpace($env:LEGACY_ASSEMBLIES_URL)) {
              throw @'
          Legacy assemblies are unavailable. Either commit them under
          Dependencies/Assemblies or set the repository variable
          LEGACY_ASSEMBLIES_URL to a ZIP download URL. The ZIP must contain an
          Assemblies directory with PikIO.dll and the other legacy runtime
          dependencies which are not restored from NuGet.
          '@
            }

            $archive = Join-Path $env:RUNNER_TEMP 'magic-rdr-assemblies.zip'
            $extractDir = Join-Path $env:RUNNER_TEMP 'magic-rdr-assemblies'
            Invoke-WebRequest $env:LEGACY_ASSEMBLIES_URL -OutFile $archive
            Expand-Archive -LiteralPath $archive -DestinationPath $extractDir -Force
            $assemblyDir = Get-ChildItem $extractDir -Directory -Recurse |
              Where-Object Name -eq 'Assemblies' |
              Select-Object -First 1
            if (-not $assemblyDir) {
              throw 'The dependency ZIP does not contain an Assemblies directory.'
            }
          }

          $referenceDir = 'Magic_RDR/bin/x86/Debug/Assemblies'
          New-Item -ItemType Directory -Force -Path $referenceDir | Out-Null
          Copy-Item (Join-Path $assemblyDir.FullName '*') $referenceDir -Recurse -Force

      - name: Build solution
        run: >-
          msbuild Magic_RDR.sln
          /m
          /p:Configuration=Release
          /p:Platform=x86
          /p:RestorePackages=false
          /verbosity:minimal

      - name: Include runtime assemblies
        shell: pwsh
        run: |
          $outputAssemblies = 'Magic_RDR/bin/x86/Release/Assemblies'
          New-Item -ItemType Directory -Force -Path $outputAssemblies | Out-Null
          Copy-Item 'Magic_RDR/bin/x86/Debug/Assemblies/*' $outputAssemblies -Recurse -Force

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: MagicRDR-${{ github.sha }}-x86
          path: Magic_RDR/bin/x86/Release/
          if-no-files-found: error
          retention-days: 30
